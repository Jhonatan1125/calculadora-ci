name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: python -m pip install pytest
      - name: Ejecutar pruebas
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4

      - name: Preparar archivo .env desde .env.example
        run: cp .env.example .env

      - name: Construir imagenes de los dos servicios con Docker Compose
        run: docker compose build

      - name: Levantar contenedores en la red de Docker
        run: docker compose up -d

      - name: Verificar comunicacion de ida y vuelta entre calculadora-api e historial-api
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health && curl -fsS http://localhost:5001/health; then
              break
            fi
            sleep 1
          done

          echo "=== 1. IDA: Guardar operacion desde calculadora-api hacia historial-api ==="
          RESPUESTA_IDA=$(curl -fsS -X POST http://localhost:8000/calcular \
            -H "Content-Type: application/json" \
            -d '{"operacion": "sumar", "a": 15, "b": 25}')
          echo "$RESPUESTA_IDA"
          echo "$RESPUESTA_IDA" | grep -q '"resultado":40.0'

          echo "=== 2. VUELTA: Leer historial desde calculadora-api consultando a historial-api ==="
          RESPUESTA_VUELTA=$(curl -fsS http://localhost:8000/historial)
          echo "$RESPUESTA_VUELTA"
          echo "$RESPUESTA_VUELTA" | grep -q '"origen":"http://historial-api:5001"'
          echo "$RESPUESTA_VUELTA" | grep -q '"resultado":40.0'

      - name: Mostrar logs de los contenedores
        if: always()
        run: docker compose logs

      - name: Apagar contenedores
        if: always()
        run: docker compose down -v
