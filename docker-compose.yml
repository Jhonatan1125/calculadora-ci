services:
  historial-api:
    build:
      context: ./historial_service
      dockerfile: Dockerfile
    container_name: historial-api
    ports:
      - "${HISTORIAL_PORT:-5001}:5001"
    env_file:
      - .env
    environment:
      - HISTORIAL_PORT=5001
      - HISTORIAL_DATA_FILE=/data/historial.json
      - HISTORIAL_API_KEY=${HISTORIAL_API_KEY}
    volumes:
      - historial_data:/data
    networks:
      - red-calculadora

  calculadora-api:
    build:
      context: ./calculadora_service
      dockerfile: Dockerfile
    container_name: calculadora-api
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_PORT=8000
      - HISTORIAL_SERVICE_URL=http://historial-api:5001
      - HISTORIAL_API_KEY=${HISTORIAL_API_KEY}
    depends_on:
      - historial-api
    networks:
      - red-calculadora

volumes:
  historial_data:

networks:
  red-calculadora:
    driver: bridge
