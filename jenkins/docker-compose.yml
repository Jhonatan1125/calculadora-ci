services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: calculadora-jenkins:lts-jdk21
    container_name: jenkins-ci
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    env_file:
      - .env
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs/jenkins.yaml
      - JENKINS_EXTERNAL_URL=${JENKINS_EXTERNAL_URL:-http://localhost:8080/}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
